name: siblings
description: >
  Checks out PaliCanon/ui-lib and PaliCanon/api beside search-front/, at the
  refs app/Cargo.toml names, with a short-lived GitHub App token (Contents:
  read). The workspace reaches both through `../ui-lib` and `../api`
  (its [patch], app/style/main.css, app/build.rs); both are private.

# Used after the job has checked search-front out into `search-front/`
# (`actions/checkout` with `path: search-front`, `persist-credentials: false`):
#
#   - uses: ./search-front/.github/actions/siblings
#     with: { app-id: ..., private-key: ... }
#
# The token is the only credential of the whole pipeline: the image build
# takes none (the siblings are COPYed, Cargo.lock holds no git source), and
# it is not left in any `.git/config` (`persist-credentials: false`). The
# token is revoked when the job ends (create-github-app-token's post step).

inputs:
  app-id:
    description: The GitHub App's id (a repository secret of the caller).
    required: true
  private-key:
    description: The GitHub App's private key (a repository secret of the caller).
    required: true
  manifest:
    description: The manifest naming the two git dependencies, relative to the workspace.
    default: search-front/app/Cargo.toml

runs:
  using: composite
  steps:
    - name: Read the refs the manifest names
      id: refs
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        MANIFEST: ${{ inputs.manifest }}
      run: |
        set -euo pipefail
        echo "ui_lib=$(bash search-front/scripts/manifest-ref.sh "$MANIFEST" palicanon-ui-lib)" >> "$GITHUB_OUTPUT"
        echo "api=$(bash search-front/scripts/manifest-ref.sh "$MANIFEST" palicanon-api-client)" >> "$GITHUB_OUTPUT"

    - name: Mint a token for ui-lib and api, Contents read
      id: app
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: PaliCanon
        repositories: |
          ui-lib
          api

    - uses: actions/checkout@v7
      with:
        repository: PaliCanon/ui-lib
        ref: ${{ steps.refs.outputs.ui_lib }}
        path: ui-lib
        token: ${{ steps.app.outputs.token }}
        persist-credentials: false

    - uses: actions/checkout@v7
      with:
        repository: PaliCanon/api
        ref: ${{ steps.refs.outputs.api }}
        path: api
        token: ${{ steps.app.outputs.token }}
        persist-credentials: false

    # A missing repository or ref fails the checkouts above; this catches a
    # checkout that succeeded on the wrong thing.
    - name: Check what the workspace reaches is there
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        test -f ui-lib/Cargo.toml || { echo "ui-lib/Cargo.toml is missing"; exit 1; }
        test -f ui-lib/build/placeholders.rs || { echo "ui-lib/build/placeholders.rs is missing"; exit 1; }
        test -f api/crates/api-client/Cargo.toml || { echo "api/crates/api-client/Cargo.toml is missing (the client is not on the checked-out ref)"; exit 1; }
