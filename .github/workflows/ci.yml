# The README's checks, one job each. Every job that runs cargo has three
# checkouts side by side, because the workspace reaches `../ui-lib` and
# `../api` (its [patch], app/style/main.css, app/build.rs) and both are
# private: this repository goes into `search-front/` and the `siblings`
# action puts ui-lib and the api beside it with a short-lived GitHub App
# token (no deploy key, no credential left in any .git/config). Cargo steps
# run in `search-front/` (`defaults.run`). No `--all-features`, no
# `--workspace`: `ssr`, `hydrate` and `csr` (the PaliCanon app's build) do not
# build together.
#
# Repository secrets used: APP_ID, APP_PRIVATE_KEY (the GitHub App, Contents:
# read on ui-lib, api and search-front), CODECOV_TOKEN (optional).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: search-front

jobs:
  fmt:
    name: rustfmt + leptosfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: search-front
          persist-credentials: false
      # rustfmt walks the modules, `#[path]` ones included: app/build.rs includes
      # ../../ui-lib/build/placeholders.rs, so fmt needs the siblings too.
      - uses: ./search-front/.github/actions/siblings
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo install leptosfmt --locked
      - run: leptosfmt --check .

  clippy:
    name: clippy (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - feature: ssr
            args: -p search_front --features ssr --all-targets
          - feature: hydrate
            args: -p search_front --lib --features hydrate --target wasm32-unknown-unknown
          # The PaliCanon app's build (task 021): csr alone, on wasm32, with
          # the browser tests' code (tests/csr.rs, tests/csr_mount.rs).
          - feature: csr
            args: -p search_front --no-default-features --features csr --target wasm32-unknown-unknown --all-targets
    steps:
      - uses: actions/checkout@v7
        with:
          path: search-front
          persist-credentials: false
      - uses: ./search-front/.github/actions/siblings
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo clippy --locked ${{ matrix.args }} -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: search-front
          persist-credentials: false
      - uses: ./search-front/.github/actions/siblings
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p search_front --features ssr

  # tests/csr.rs and tests/csr_mount.rs (task 021) in a real browser: the
  # Search fragment mounted under /search, as the PaliCanon app mounts it.
  # wasm-bindgen-test-runner drives a headless Chrome through chromedriver;
  # ubuntu-latest ships Google Chrome and its matching chromedriver
  # ($CHROMEWEBDRIVER). The runner must be the wasm-bindgen of Cargo.lock.
  # The two test wasms are the csr bundles the second check reads: each holds
  # the fragment and no server function, no endpoint, no token path. The PaliCanon
  # app's own bundle is checked by the app (T5a) with the same script.
  test-browser:
    name: test (csr, headless Chrome) and the csr bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: search-front
          persist-credentials: false
      - uses: ./search-front/.github/actions/siblings
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - id: wasm-bindgen
        run: |
          set -euo pipefail
          version="$(cargo pkgid --locked wasm-bindgen | sed 's/.*@//')"
          if [ -z "$version" ]; then
            echo "::error::no wasm-bindgen version in Cargo.lock"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test --locked -p search_front --no-default-features --features csr --target wasm32-unknown-unknown --test csr --test csr_mount
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      # Each csr test bundle's wasm-bindgen output: no token, no API client,
      # no mock, and none of the site's endpoint (BUNDLE_MODE=csr).
      - name: The csr bundles hold no token path
        run: |
          set -euo pipefail
          for target in csr csr_mount; do
            wasm="$(cargo test --locked -p search_front --no-default-features --features csr --target wasm32-unknown-unknown --test "$target" --no-run --message-format=json | python3 -c 'import json,sys; target = sys.argv[1]; print(next(m["executable"] for m in map(json.loads, sys.stdin) if m.get("reason") == "compiler-artifact" and m["target"]["name"] == target and m.get("executable")))' "$target")"
            wasm-bindgen --target web --out-dir "pkg-$target" "$wasm"
            BUNDLE_MODE=csr PKG_DIR="pkg-$target" scripts/check-wasm-no-token.sh
          done

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          path: search-front
          persist-credentials: false
      - uses: ./search-front/.github/actions/siblings
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --locked --no-deps -p search_front --features ssr

  msrv:
    # 1.91, not lower: the API client and its types (Duration::from_mins, let
    # chains) need it, and so does `uuid` 1.89 (task 007, probe P3).
    name: msrv (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: search-front
          persist-credentials: false
      - uses: ./search-front/.github/actions/siblings
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@1.91
      # --locked: the committed Cargo.lock is what the MSRV claim is verified
      # against; a fresh resolution could pull a dependency with a higher MSRV.
      - run: cargo check --locked -p search_front --features ssr

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: search-front
          persist-credentials: false
      - uses: ./search-front/.github/actions/siblings
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov -p search_front --features ssr --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          working-directory: search-front
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  bundle:
    # The browser bundle holds no token and no API client: `cargo leptos
    # build`, then scripts/check-wasm-no-token.sh (the image build runs the
    # same check, this one fails earlier and on pull requests).
    name: bundle (no token in the wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: search-front
          persist-credentials: false
      - uses: ./search-front/.github/actions/siblings
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # The tools, cached by the versions that shape them: cargo-leptos as the
      # Dockerfile pins it, wasm-bindgen-cli read from the lock (it must match
      # the crate to the patch version).
      - name: Read the wasm-bindgen version of the lock
        id: wbg
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[^0-9.]/, ""); print; exit}' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: tools
        with:
          path: ~/.cargo/bin
          key: leptos-tools-0.3.11-wbg-${{ steps.wbg.outputs.version }}
      - if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-leptos --version 0.3.11 --locked
          cargo install wasm-bindgen-cli --version "${{ steps.wbg.outputs.version }}" --locked
      - run: cargo leptos build --release --cargo-locked
      - run: scripts/check-wasm-no-token.sh

  scripts:
    # The shell, Python and Node tests that guard the deploy.
    name: scripts, workflows, Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: search-front
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/infra_probe_test.py
      - run: python3 scripts/check_workflows_test.py
      - run: python3 scripts/check_workflows.py
      - run: bash scripts/manifest-ref.test.sh
      - run: bash scripts/serving-revision.test.sh
      - run: bash infra/scripts/origin-secret.test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A quoted glob, not the directory: node 22 (the job's) runs a directory
      # argument as a module and fails with "Cannot find module" (node 26 on a
      # laptop walks it, which hid it).
      - run: node --test 'infra/worker/*.test.mjs'

  tofu:
    name: tofu (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: search-front
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - run: tofu fmt -check -recursive
        working-directory: search-front/infra
      - run: tofu init -backend=false -input=false
        working-directory: search-front/infra
      - run: tofu validate
        working-directory: search-front/infra
