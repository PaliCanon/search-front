name: deploy

# A tag v* builds the image and pushes it to GHCR. Nothing is deployed from
# here: prod runs on the user's server (ssh.lsh.tech, repo Lsh0x/lsh-tech,
# stack palicanon/prod), which pulls the image BY DIGEST behind a Cloudflare
# tunnel. The run's summary gives the digest to put in the stack; the stack is
# updated from it by hand. A push to main builds and deploys nothing (ci.yml
# checks it).
# The image is content-addressed: built only when its inputs changed
# (scripts/image-hash.sh: the tracked inputs, the Dockerfile text and scripts/
# included, plus the ui-lib and api commits built against). The tag is not an
# input: a tag on an image that already exists only adds the release tag to it.
#
# No GCP here: the GHCR login uses the job's own GITHUB_TOKEN. Repository
# secrets: APP_ID, APP_PRIVATE_KEY, the GitHub App (Contents: read on ui-lib,
# api and search-front) that the `siblings` action mints its token from, for
# the two sibling checkouts. Nothing else is a secret here: the image build
# takes no credential (Dockerfile).

on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/palicanon/search-front

# Three checkouts side by side: the build context is the folder holding
# search-front/, ui-lib/ and api/. Commands run in search-front/.
defaults:
  run:
    working-directory: search-front

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: search-front
          persist-credentials: false
      - uses: ./search-front/.github/actions/siblings
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag is computed ONCE, after both checkouts, and used by the build,
      # the existence check and the summary.
      - name: Compute the input hash and image refs
        id: vars
        run: |
          set -euo pipefail
          TAG=$(scripts/image-hash.sh ../ui-lib ../api)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_hash=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
          echo "search-front: input hash $TAG (ui-lib $(git -C ../ui-lib rev-parse --short HEAD), api $(git -C ../api rev-parse --short HEAD))"

      - name: Check whether that image already exists
        id: check-image
        env:
          IMAGE_HASH: ${{ steps.vars.outputs.image_hash }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE_HASH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "search-front: $IMAGE_HASH already built, skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        if: steps.check-image.outputs.exists != 'true'
        with:
          # `working-directory` does not apply to `uses:` steps: the context
          # is the workspace root, the folder holding the three checkouts.
          context: .
          file: search-front/Dockerfile
          # No `secrets:`, no `ssh:`: the build takes no credential (the
          # siblings are COPYed and the lock holds no git source). No build
          # args either: the image does not change with the ref.
          push: true
          # Links the package to this repository, so later pushes keep working.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.vars.outputs.image_hash }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that already existed gets the release tag too: same digest.
      - name: Tag the existing image with the release
        if: steps.check-image.outputs.exists == 'true'
        env:
          IMAGE_HASH: ${{ steps.vars.outputs.image_hash }}
          RELEASE: ${{ github.ref_name }}
        run: docker buildx imagetools create --tag "$IMAGE:$RELEASE" "$IMAGE_HASH"

      # What the stack pulls: the digest, not a tag.
      - name: Write the digest to the summary
        env:
          IMAGE_HASH: ${{ steps.vars.outputs.image_hash }}
          TAG: ${{ steps.vars.outputs.tag }}
          RELEASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "$IMAGE_HASH" --format '{{.Manifest.Digest}}')
          test -n "$DIGEST" || { echo "::error::no digest for $IMAGE_HASH"; exit 1; }
          {
            echo "### search-front $RELEASE"
            echo
            echo "- image: \`$IMAGE@$DIGEST\`"
            echo "- tag: \`$TAG\`"
            echo
            echo "Put the image in the lsh-tech stack (palicanon/prod) by hand."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "search-front: $IMAGE@$DIGEST ($TAG, release $RELEASE)"
