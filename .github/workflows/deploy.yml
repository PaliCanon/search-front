name: deploy

# Push to main → dev (search-front-dev); tag v* → prod (search-front-prod).
# The image is content-addressed: built only when its inputs changed (the ref
# is not an input: the footer badge's release is NOT in the image), rolled out
# with no traffic first as a revision that carries its release (the two env
# values SEARCH_FRONT_ENV and SEARCH_FRONT_SHA, from scripts/release-values.sh,
# written with the flag that updates single variables), checked through the
# revision's tagged URL with the origin header (the page's search-release
# metas must say that release: exit 8 otherwise), then given the traffic, then
# checked again through the public host and (it must refuse) the bare Cloud
# Run URL. A run is skipped only when the serving revision already has the
# image AND the release. The model is learn-pali's deploy.yml (task 060);
# what differs is the three checkouts, the origin secret, the single step
# that rolls out and moves the traffic, and no manual dispatch.
#
# Repository variables (not secrets, no value here):
#   WIF_PROVIDER, DEPLOYER_SA, GCP_PROJECT — the workload identity of the
#   `github-deployer` service account (platform / the site's infra).
# Repository secrets: APP_ID, APP_PRIVATE_KEY — the GitHub App (Contents:
#   read on ui-lib, api and search-front) that the `siblings` action mints
#   its token from, for the two sibling checkouts. Nothing else is a secret
#   here: the image build takes no credential (Dockerfile).

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  ENV: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
  HOST: ${{ startsWith(github.ref, 'refs/tags/') && 'search.palicanon.app' || 'search.dev.palicanon.app' }}
  REGION: europe-west1
  PROJECT: ${{ vars.GCP_PROJECT }}

# Three checkouts side by side: the build context is the folder holding
# search-front/, ui-lib/ and api/. Commands run in search-front/.
defaults:
  run:
    working-directory: search-front

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: search-front
          persist-credentials: false
      - uses: ./search-front/.github/actions/siblings
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      # The tag is computed ONCE, after both checkouts, and used by the
      # build, the existence check and the rollout (scripts/image-hash.sh:
      # the tracked inputs, the Dockerfile text and scripts/ included, plus
      # the ui-lib and api commits built against).
      - name: Compute the input hash and image refs
        id: vars
        run: |
          set -euo pipefail
          TAG=$(scripts/image-hash.sh ../ui-lib ../api)
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/palicanon/search-front"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_hash=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
          echo "search-front: input hash $TAG (ui-lib $(git -C ../ui-lib rev-parse --short HEAD), api $(git -C ../api rev-parse --short HEAD))"

      - name: Check whether that image already exists
        id: check-image
        env:
          IMAGE_HASH: ${{ steps.vars.outputs.image_hash }}
        run: |
          set -euo pipefail
          if gcloud artifacts docker images describe "$IMAGE_HASH" --project "$PROJECT" --quiet >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "search-front: $IMAGE_HASH already built, skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check-image.outputs.exists != 'true'
      - uses: docker/build-push-action@v6
        if: steps.check-image.outputs.exists != 'true'
        with:
          # `working-directory` does not apply to `uses:` steps: the context
          # is the workspace root, the folder holding the three checkouts.
          context: .
          file: search-front/Dockerfile
          # No `secrets:`, no `ssh:`: the build takes no credential (the
          # siblings are COPYed and the lock holds no git source). No build
          # args either: the release (the footer badge's tag or branch, and
          # commit) is not in the image, so its hash does not change with the
          # ref. The rollout step writes it onto the revision.
          push: true
          tags: |
            ${{ steps.vars.outputs.image_hash }}
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # What runs is the revision that SERVES the traffic, not the service's
      # template: after a rollout that built a revision and never moved the
      # traffic (a failed check, a cancelled job) the template already holds
      # the new image while the old revision still serves, and comparing the
      # template would report that as done. The serving revision is also
      # recorded (`serving`), for the rollback of a failed public check.
      # "Already running" means that revision has this image AND this release
      # (its SEARCH_FRONT_ENV and SEARCH_FRONT_SHA, absent == empty): the
      # image no longer changes with the ref, so every push to main, and a tag
      # on main's image, still makes a revision (same image, new env). A
      # revision whose JSON does not parse, that names no image, or whose env
      # is not a list falls open to a deploy and the log says why (never a
      # skip, never a dead job).
      - name: Is that image already running?
        id: current
        env:
          IMAGE_HASH: ${{ steps.vars.outputs.image_hash }}
        run: |
          set -euo pipefail
          SERVICE="search-front-$ENV"
          # The 100% entry of a service that follows the latest revision (what
          # tofu creates) names none: scripts/serving-revision.sh then reads
          # the latest ready one. An empty answer would silently disable the
          # rollback, so it fails the job.
          SERVING=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format json \
            | scripts/serving-revision.sh) \
            || { echo "::error::no revision serves $SERVICE: the rollback would have nowhere to go"; exit 1; }
          # The release this run intends (a refused ref fails the step here).
          INTENDED=$(scripts/release-values.sh)
          REVISION_JSON=$(gcloud run revisions describe "$SERVING" --project "$PROJECT" --region "$REGION" --format json)
          CURRENT=$(printf '%s' "$REVISION_JSON" | jq -r '.spec.containers[0].image // empty' 2>/dev/null) || CURRENT=""
          echo "serving=$SERVING" >> "$GITHUB_OUTPUT"
          # An unreadable revision JSON (empty, not JSON, no image) fails OPEN
          # to a deploy (an extra revision is the worst case) and says why; it
          # never kills the step. The `gcloud run revisions describe` call
          # above still fails the step: a transient failure is re-run.
          if [ -z "$CURRENT" ]; then
            if printf '%s' "$REVISION_JSON" | jq -e . >/dev/null 2>&1; then
              REASON="the revision JSON names no image"
            else
              REASON="the revision JSON is empty or does not parse"
            fi
            echo "running=false" >> "$GITHUB_OUTPUT"
            echo "search-front: could not read the serving revision's image/release ($REASON): deploying a new revision"
          elif [ "$CURRENT" != "$IMAGE_HASH" ]; then
            echo "running=false" >> "$GITHUB_OUTPUT"
          else
            # `same`: 0 = this image and this release, 1 = another release,
            # 2 = a revision whose env it cannot read (a wrong type): that one
            # deploys too and says so, never "another release".
            RELEASE_RC=0
            scripts/release-values.sh same <<<"$REVISION_JSON" || RELEASE_RC=$?
            case "$RELEASE_RC" in
              0)
                echo "running=true" >> "$GITHUB_OUTPUT"
                echo "search-front: $SERVICE already serves $IMAGE_HASH as $INTENDED (revision $SERVING), nothing to deploy"
                ;;
              2)
                echo "running=false" >> "$GITHUB_OUTPUT"
                echo "search-front: could not read the serving revision's release (its env is not a list): deploying a new revision"
                ;;
              *)
                echo "running=false" >> "$GITHUB_OUTPUT"
                echo "search-front: $SERVICE serves the image but another release ($INTENDED intended): a new revision with the new env"
                ;;
            esac
          fi

      # The revision carries its release: the two env values written here
      # and nowhere else, with the flag that updates the variables one by one
      # (the flag that replaces them all would wipe RUST_LOG, SEARCH_API_URL
      # and the secret references, and every request would then be refused).
      # The gate then reads the page of the tagged revision: its search-release
      # metas must say the release just written (exit 8 otherwise, and the
      # traffic stays where it is).
      - name: Roll out without traffic, check, then serve
        if: steps.current.outputs.running != 'true'
        env:
          IMAGE_HASH: ${{ steps.vars.outputs.image_hash }}
        run: |
          set -euo pipefail
          SERVICE="search-front-$ENV"
          TAG="sha-${GITHUB_SHA::7}"
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE_HASH" \
            --update-env-vars "$(scripts/release-values.sh)" \
            --no-traffic --tag "$TAG" --quiet
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format json \
            | jq -r --arg t "$TAG" '[.status.traffic[] | select(.tag == $t) | .url] | .[0] // empty')
          test -n "$URL" || { echo "no URL for the revision tag $TAG on $SERVICE"; exit 1; }

          # The origin secret, into a 0600 header file that curl reads with
          # `-H @file`: it is on no command line and in no log (masked).
          umask 077
          HEADER_FILE="$RUNNER_TEMP/origin-header"
          trap 'rm -f "$HEADER_FILE"' EXIT
          VALUE=$(gcloud secrets versions access latest --secret "search-front-origin-secret-$ENV" --project "$PROJECT")
          test -n "$VALUE" || { echo "search-front-origin-secret-$ENV has no value (infra/README.md, step 6)"; exit 1; }
          echo "::add-mask::$VALUE"
          printf 'x-origin-auth: %s\n' "$VALUE" > "$HEADER_FILE"
          unset VALUE

          # The page, the wasm, a real search, no token on the wire, the
          # guard on, and the release the page says: on the tagged revision,
          # before it has any traffic.
          ROLLOUT_EXPECT_ENV="$(scripts/release-values.sh env)"
          ROLLOUT_EXPECT_SHA="$(scripts/release-values.sh sha)"
          export ROLLOUT_EXPECT_ENV ROLLOUT_EXPECT_SHA
          RC=0
          scripts/rollout-check.sh "$URL" "$HEADER_FILE" || RC=$?
          if [ "$RC" = 8 ]; then
            echo "::error::the revision at its tagged URL serves another release than the one deployed (its search-release metas are not env '$ROLLOUT_EXPECT_ENV', sha '$ROLLOUT_EXPECT_SHA'); the traffic is untouched"
            exit 1
          elif [ "$RC" != 0 ]; then
            echo "::error::the revision at its tagged URL failed rollout-check.sh; the traffic is untouched"
            exit 1
          fi

          gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" --to-latest --quiet
          echo "search-front: $SERVICE now serves $IMAGE_HASH"

      # The public-host check drives a headless Chrome (rollout-check.sh's
      # `hydrate`: the page hydrates past the nodes Cloudflare injects,
      # ui-lib 063); its path goes to the script as CHROME.
      - uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Check the public host, and that the bare origin refuses
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          # The revision that served before this run moved the traffic, and
          # whether this run moved it at all (nothing to undo when the image
          # was already served).
          PREVIOUS: ${{ steps.current.outputs.serving }}
          MOVED: ${{ steps.current.outputs.running != 'true' }}
        run: |
          set -euo pipefail
          SERVICE="search-front-$ENV"

          # Puts the traffic back on the revision that served before, when
          # this run moved it, so a bad rollout does not stay public (D11).
          # Only the public-host check calls it: a bare origin that answers
          # is the service's env, which a rollback does not change.
          # It may itself fail: that must not end the step with gcloud's
          # exit code (set -e) in place of the check's, so a failed update
          # only reports. Then the traffic is read back (status.traffic):
          # when the previous revision does not serve 100%, whatever the
          # reason, the job exits 5 (the rollback did not restore it); when
          # it does, the function returns and the caller exits with the
          # check's own code.
          rollback() {
            if [ "$MOVED" != true ] || [ -z "$PREVIOUS" ]; then
              echo "search-front: this run moved no traffic, nothing to put back"
              return 0
            fi
            gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" \
              --to-revisions="$PREVIOUS=100" --quiet \
              || echo "::error::rollback to $PREVIOUS failed"
            NOW=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format json \
              | scripts/serving-revision.sh) || NOW=""
            if [ "$NOW" != "$PREVIOUS" ]; then
              echo "::error::rollback did not restore $PREVIOUS"
              exit 5
            fi
            echo "::error::search-front: traffic of $SERVICE moved back to $PREVIOUS"
          }

          # 1. Through Cloudflare and the Worker (which adds the header; this
          #    script sends none and is given none): the page, the wasm, a
          #    real search, no token on the wire, and the page hydrating in
          #    Chrome on /, a search and /privacy (`hydrate`: a panic or no
          #    data-hydrated is exit 1). Exit 1 is a refusal or a failed
          #    check: a few tries (the new revision and the edge settle),
          #    then the traffic goes back. Exit 4 is the Worker
          #    itself answering 500 (it lost its secret): the rollout is not
          #    at fault, so no rollback, the job fails naming the remedy.
          RC=1
          for _ in 1 2 3 4 5; do
            RC=0
            scripts/rollout-check.sh --via-worker "https://$HOST" || RC=$?
            [ "$RC" = 1 ] || break
            sleep 3
          done
          if [ "$RC" = 3 ]; then
            # Ruling R6: Cloudflare (Bot Fight, a managed challenge) turned the
            # runner away; that is not the service failing. The decision is
            # the user's (a WAF skip rule for the runner, or drop this check).
            # It may come from Chrome's `hydrate` step, after the curl checks
            # passed: hydration is then unchecked, which is not a pass. The
            # orchestrator runs the check by hand before any prod tag.
            echo "::warning::Cloudflare challenged the runner on https://$HOST/ (R6, infra/README.md): the public-host check did not complete (hydration unchecked): run scripts/rollout-check.sh --via-worker https://$HOST by hand before a prod tag"
          elif [ "$RC" = 4 ]; then
            echo "::error::the Worker answered 500 — run infra/scripts/origin-secret push $ENV"
            exit "$RC"
          elif [ "$RC" != 0 ]; then
            echo "https://$HOST/ failed rollout-check.sh --via-worker (exit $RC: the service refused it, or a content check failed)"
            # A refusal or a failed content check (exit 1, after the retries):
            # put the traffic back, and fail the job (D11).
            if [ "$RC" = 1 ]; then rollback; fi
            exit "$RC"
          fi

          # 2. The bare Cloud Run URL, as anyone who learned it would call it:
          #    403 with an empty body, with no header and with a wrong one.
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format='value(status.url)')
          RC=0
          scripts/rollout-check.sh --refused "$SERVICE_URL" || RC=$?
          if [ "$RC" != 0 ]; then
            # A bare origin that answers is open to anyone who learned the
            # URL. NO rollback: both revisions boot from the same env, so the
            # previous one answers too and moving the traffic restores
            # nothing (D13). The cause is the service's ORIGIN_SECRET env.
            echo "rollout-check.sh --refused on $SERVICE_URL: exit $RC"
            echo "::error::the bare origin answers — the service's ORIGIN_SECRET env is missing or empty (infra: the secret reference); traffic left as is"
            exit "$RC"
          fi
          echo "search-front: https://$HOST is served and the origin refuses a direct call"
