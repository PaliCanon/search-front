[package]
name = "search_front"
description = "search-front: the PaliCanon search page, Leptos SSR + hydrate on palicanon-ui-lib."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Built from ../ui-lib (the workspace's [patch]); the branch must hold the
# standalone manifest, Cargo reads it even when patched.
palicanon-ui-lib = { git = "ssh://git@github.com/PaliCanon/ui-lib.git", branch = "main" }
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
# This service's own strings, a typed catalogue generated by build.rs (like
# ui-lib's): read in ui-lib's `language_signal`, not leptos_i18n's.
leptos_i18n = { version = "0.6.2", default-features = false }
leptos_axum = { workspace = true, optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"], optional = true }
# The PaliCanon API's typed client (server side only: it refuses to build for
# wasm32). Built from ../api (the workspace's [patch]) until it is published.
palicanon-api-client = { git = "ssh://git@github.com/PaliCanon/api.git", branch = "main", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# The browser clock for the day index (`components::home::now_ms`); already
# in the tree through leptos.
js-sys = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
# Diacritic-insensitive snippet highlighting (`satipatthana` lights up
# `satipaṭṭhāna`): NFD-decomposes a char so a combining mark can be
# stripped before folding. Pure Rust, no_std-friendly, builds for wasm32.
unicode-normalization = "0.1"

[build-dependencies]
# As in ui-lib's build.rs: the parser's diagnostics fail the build on a missing key.
leptos_i18n_parser = "=0.6.2"
leptos_i18n_codegen = "=0.6.2"
# Reads the locale files for the placeholder-parity check (ui-lib's build/placeholders.rs).
serde_json = "1"

[dev-dependencies]
serde_json = "1"
# The SSR render tests drive the page's futures (task 005, slice 6).
futures = "0.3"
any_spawner = { version = "0.3", features = ["tokio"] }

[features]
hydrate = [
  "leptos/hydrate",
  "palicanon-ui-lib/hydrate",
  "dep:console_error_panic_hook",
  "dep:wasm-bindgen",
  "dep:js-sys",
]
ssr = [
  "dep:axum",
  "dep:tokio",
  "dep:leptos_axum",
  "dep:palicanon-api-client",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "palicanon-ui-lib/ssr",
]

[lints]
workspace = true
