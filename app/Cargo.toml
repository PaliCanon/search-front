[package]
name = "search_front"
description = "search-front: the PaliCanon search page, Leptos SSR + hydrate on palicanon-ui-lib, and a client-side fragment for the PaliCanon app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned by tag (docs conventions/ui-lib.md); in development the workspace's
# [patch] builds from ../ui-lib, and the tag must hold the standalone manifest.
palicanon-ui-lib = { git = "ssh://git@github.com/PaliCanon/ui-lib.git", tag = "v0.4.3" }
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
# This service's own strings, a typed catalogue generated by build.rs (like
# ui-lib's): read in ui-lib's `language_signal`, not leptos_i18n's.
leptos_i18n = { version = "0.6.2", default-features = false }
leptos_axum = { workspace = true, optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"], optional = true }
# The PaliCanon API's typed client (server side only: it refuses to build for
# wasm32). Built from ../api (the workspace's [patch]) until it is published.
palicanon-api-client = { git = "ssh://git@github.com/PaliCanon/api.git", branch = "main", optional = true }
# The origin guard compares the Worker's secret in constant time (`origin.rs`).
subtle = { version = "2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# The in-place submit reads the submitted form (`FormData`), csr only
# (`fragment::submit`); already in the tree through leptos.
web-sys = { version = "0.3", optional = true, features = ["FormData", "HtmlFormElement"] }
# The browser clock for the day index (`components::home::now_ms`); already
# in the tree through leptos.
js-sys = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
# Diacritic-insensitive snippet highlighting (`satipatthana` lights up
# `satipaṭṭhāna`): NFD-decomposes a char so a combining mark can be
# stripped before folding. Pure Rust, no_std-friendly, builds for wasm32.
unicode-normalization = "0.1"

[build-dependencies]
# As in ui-lib's build.rs: the parser's diagnostics fail the build on a missing key.
leptos_i18n_parser = "=0.6.2"
leptos_i18n_codegen = "=0.6.2"
# Reads the locale files for the placeholder-parity check (ui-lib's build/placeholders.rs).
serde_json = "1"

[dev-dependencies]
serde_json = "1"
# The SSR render tests drive the page's futures (task 005, slice 6).
futures = "0.3"
any_spawner = { version = "0.3", features = ["tokio"] }

# The browser tests of the fragment (tests/csr.rs, tests/csr_mount.rs), run by
# wasm-bindgen-test-runner in a headless Chrome; the extra web-sys features
# build the events and read the page.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "History",
  "HtmlDocument",
  "HtmlInputElement",
  "KeyboardEvent",
  "KeyboardEventInit",
  "Location",
  "NodeList",
] }

[features]
# The site (search.palicanon.app): the server renders, the browser hydrates.
# Built with exactly one of the three modes below, never two (no
# `--all-features`; ci.yml has one clippy entry per mode).
#
# `site` is private: the site's own code (its shell, the footer pages, the
# server function and the backend that calls it). `ssr` and `hydrate` imply
# it; `csr` never does, so the PaliCanon app's build holds no endpoint, no
# API client and no token (tests/cfg_gates.rs).
site = []
# Private: the code that needs a browser (the focus shortcut, the browser
# clock), shared by the two client modes. Never gate it on `hydrate`.
browser = ["dep:wasm-bindgen", "dep:js-sys"]
hydrate = [
  "leptos/hydrate",
  "palicanon-ui-lib/hydrate",
  "site",
  "browser",
  "dep:console_error_panic_hook",
]
# The PaliCanon app: the browser builds the page from an empty document, no
# server (the fragment, `crate::fragment`, mounted by the app's own host).
csr = ["leptos/csr", "palicanon-ui-lib/csr", "browser", "dep:web-sys"]
ssr = [
  "site",
  "dep:axum",
  "dep:tokio",
  "dep:leptos_axum",
  "dep:subtle",
  "dep:palicanon-api-client",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "palicanon-ui-lib/ssr",
]

[lints]
workspace = true
